# Runs the tests in _dev/tests on every pull request and on pushes to main.
# .github/ is not published by GitHub Pages.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: calculation tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test _dev/tests/unit.test.mjs _dev/tests/features.test.mjs

  browser:
    name: browser tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Serve the site and run the browser tests
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:8765/ && break; sleep 1; done
          node _dev/tests/browser.test.cjs
